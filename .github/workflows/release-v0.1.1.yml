name: Release v0.1.1

on:
  workflow_run:
    workflows: ["Validate"]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if gh release view v0.1.1 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release v0.1.1 already exists"
            exit 0
          fi
          gh release create v0.1.1 \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${TARGET_SHA}" \
            --title "Zonergy Venus v0.1.1" \
            --notes "HACS publication candidate. Repository metadata and validation completed successfully. No functional changes to inverter communication."
