name: Release

# Publishes a GitHub release for the version in manifest.json once the
# Validate workflow has passed on main. Versions with a suffix such as
# "-beta.1" are published as prereleases. Nothing happens when a release for
# the current version already exists.

on:
  workflow_run:
    workflows: ["Validate"]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Read version and check for an existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 -c "import json; print(json.load(open('custom_components/zonergy_venus/manifest.json'))['version'])")"
          tag="v${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists"
            echo "needed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "needed=true" >> "${GITHUB_OUTPUT}"
          fi
      - uses: actions/setup-python@v5
        if: steps.version.outputs.needed == 'true'
        with:
          python-version: "3.12"
      - name: Validate BLE firmware
        if: steps.version.outputs.needed == 'true'
        run: |
          python -m pip install 'esphome==2026.9.0'
          cp esphome/secrets.yaml.example esphome/secrets.yaml
          esphome config esphome/zonergy-venus-esp32-ble.yaml >/dev/null
          rm esphome/secrets.yaml
      - name: Extract release notes from the changelog
        if: steps.version.outputs.needed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="${VERSION}" '
            $1 == "##" && $2 == v { found = 1; next }
            $1 == "##" { found = 0 }
            found
          ' CHANGELOG.md > "${RUNNER_TEMP}/release-notes.md"
          if ! grep -q '[^[:space:]]' "${RUNNER_TEMP}/release-notes.md"; then
            echo "CHANGELOG.md has no section for ${VERSION}" >&2
            exit 1
          fi
      - name: Create release
        if: steps.version.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          flags=()
          case "${VERSION}" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${TARGET_SHA}" \
            --title "Zonergy Venus ${TAG}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            "${flags[@]}"
