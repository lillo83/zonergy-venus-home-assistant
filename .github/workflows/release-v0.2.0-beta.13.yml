name: Release v0.2.0-beta.13

on:
  push:
    branches: [feature/zonergy-cloud-read-only]
    paths:
      - ".github/workflows/release-v0.2.0-beta.13.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create beta release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.0-beta.13 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release v0.2.0-beta.13 already exists"
            exit 0
          fi
          gh release create v0.2.0-beta.13 \\
            --repo "${GITHUB_REPOSITORY}" \\
            --target "${GITHUB_SHA}" \\
            --prerelease \\
            --title "Zonergy Venus v0.2.0-beta.13" \\
            --notes "Removes the unsupported live-register probe and its diagnostic entities, and always registers all known cloud statistics. Vendor source data normally refreshes every 4–5 minutes."
