name: Apply multi-connection update

on:
  push:
    branches:
      - feature/zonergy-multi-connection
    paths:
      - .github/workflows/apply-multi-connection.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply prepared update
        env:
          PATCH_B64: ""
        run: |
          printf '%s' "$PATCH_B64" | base64 --decode | gzip --decompress > /tmp/update.patch
          git apply --index /tmp/update.patch
          git rm .github/workflows/apply-multi-connection.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add ESPHome Bluetooth as a third connection option"
          git push origin HEAD
