    name: "Stato Inverter"
    register_type: read
    address: 2302
    value_type: S_WORD

  # -------------------- FASCE ORARIE CARICA/SCARICA (2728-2743, SOLO LETTURA) --------------------
  # Ogni orario occupa 2 registri: ora e minuti, ciascuno come 2 caratteri ASCII
  # (es. 0x3031 = "01"). L'inverter accetta solo la lettura con function 4.
  # 2728-2735 = periodo 1 (confermato con l'app), 2736-2743 = periodo 2 (da verificare).
  # Valori grezzi interni: in Home Assistant compaiono i sensori di testo "HH:MM".
  - platform: modbus_controller
    modbus_controller_id: inverter
    id: r2728
    internal: true
    register_type: read
    address: 2728
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: inverter
    id: r2729
    internal: true
    register_type: read
    address: 2729
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: inverter
    id: r2730
    internal: true
    register_type: read
    address: 2730
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: inverter
    id: r2731
    internal: true
    register_type: read
    address: 2731
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: inverter
    id: r2732
    internal: true
    register_type: read
    address: 2732
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: inverter
    id: r2733
    internal: true
    register_type: read
    address: 2733
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: inverter
    id: r2734
    internal: true
    register_type: read
    address: 2734
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: inverter
    id: r2735
    internal: true
    register_type: read
    address: 2735
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: inverter
    id: r2736
    internal: true
    register_type: read
    address: 2736
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: inverter
    id: r2737
    internal: true
    register_type: read
    address: 2737
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: inverter
    id: r2738
    internal: true
    register_type: read
    address: 2738
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: inverter
    id: r2739
    internal: true
    register_type: read
    address: 2739
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: inverter
    id: r2740
    internal: true
    register_type: read
    address: 2740
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: inverter
    id: r2741
    internal: true
    register_type: read
    address: 2741
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: inverter
    id: r2742
    internal: true
    register_type: read
    address: 2742
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: inverter
    id: r2743
    internal: true
    register_type: read
    address: 2743
    value_type: U_WORD

# =========================================================
# TEMPLATE (segni potenza + energie giornaliere)
# =========================================================
  # Rete - Prelievo (valori positivi)
  - platform: template
    name: "Potenza Prelievo Rete"
    id: potenza_prelievo_rete
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    lambda: |-
      float v = id(potenza_attiva_rete).state;
      return (isnan(v) || v <= 0) ? 0.0 : v;

  # Rete - Immissione (valori negativi trasformati in positivi)
  - platform: template
    name: "Potenza Immissione Rete"
    id: potenza_immissione_rete
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    lambda: |-
      float v = id(potenza_attiva_rete).state;
      return (isnan(v) || v >= 0) ? 0.0 : -v;

  # Batteria - Carica
  - platform: template
