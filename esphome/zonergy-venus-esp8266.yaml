    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    lambda: |-
      float v = id(potenza_batteria).state;
      return (isnan(v) || v <= 0) ? 0.0 : v;

  # Batteria - Scarica
  - platform: template
    name: "Potenza Scarica Batteria"
    id: potenza_scarica_batt
    unit_of_measurement: "W"
    device_class: power
