substitutions:
  # Durata massima della carica forzata: allo scadere l'ESP la spegne da solo,
  # anche se Home Assistant non è raggiungibile.
  forza_carica_max_minuti: "120"

esphome:
  name: inverter-esp
  friendly_name: Inverter Energia
  project:
    name: lillo83.zonergy_venus
    version: "0.1.5"

esp8266:
  board: d1_mini

logger:
  baud_rate: 0
  level: WARN

api:
  # Per usare la crittografia, decommenta queste due righe e aggiungi
  # api_encryption_key in secrets.yaml. Inserisci poi la stessa chiave in HA.
  # encryption:
  #   key: !secret api_encryption_key
  # Failsafe: se Home Assistant si disconnette, la carica forzata viene spenta
  # dall'ESP stesso (scrive solo 0 sul registro 2956).
  on_client_disconnected:
    - if:
        condition:
          switch.is_on: forza_carica
        then:
          - logger.log:
              level: WARN
              format: "HA disconnesso: spengo la carica forzata"
          - switch.turn_off: forza_carica

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

web_server:
  port: 80

uart:
  id: uart_bus
  tx_pin: GPIO5        # D1 → DI
  rx_pin: GPIO2        # D4 → RO
  baud_rate: 115200
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 512
  # Ascolto passivo: sul bus RS485 c'è anche il dongle Wi-Fi originale.
  # Registra nel log (WARN, tag "sniff") ogni frame di scrittura che passa
  # sulla linea: singola (function 6 = 0x06) e multipla (function 16 = 0x10).
  # Non trasmette nulla.
  debug:
    direction: RX
    dummy_receiver: false
    after:
      timeout: 10ms
    sequence:
      - lambda: |-
          for (size_t i = 0; i + 1 < bytes.size(); i++) {
            if (bytes[i] == 0x01 && (bytes[i + 1] == 0x10 || bytes[i + 1] == 0x06)) {
              ESP_LOGW("sniff", "FC%02u (%u byte): %s", (unsigned) bytes[i + 1],
                       (unsigned) bytes.size(), format_hex_pretty(bytes).c_str());
              break;
            }
          }

modbus:
  id: modbus1
  uart_id: uart_bus
  flow_control_pin: GPIO4   # D2 = DE+RE
  send_wait_time: 500ms

modbus_controller:
  - id: inverter
    modbus_id: modbus1
    address: 1
    update_interval: 6s
    command_throttle: 1000ms
    allow_duplicate_commands: false
    max_cmd_retries: 2
    offline_skip_updates: 5

# =========================================================
# SENSORI
# =========================================================
sensor:
  - platform: wifi_signal
    name: "Segnale Wi-Fi"
    update_interval: 60s

  # -------------------- BATTERIA --------------------
  - platform: modbus_controller
    modbus_controller_id: inverter
    name: "Tensione Porta Batteria"
    register_type: read
    address: 2967
    value_type: S_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: inverter
    name: "Corrente Porta Batteria"
    register_type: read
    address: 2968
    value_type: S_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: inverter
    name: "Potenza Batteria"
    id: potenza_batteria
    register_type: read
    address: 2969
    value_type: S_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - lambda: |-
          if (x > -6000 && x < 6000) return x;
          return NAN;

  - platform: modbus_controller
    modbus_controller_id: inverter
    name: "Capacità Sistema Batteria"
    register_type: read
