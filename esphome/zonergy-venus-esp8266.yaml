# =========================================================
# SWITCH (scrittura)
# =========================================================
switch:
  - platform: modbus_controller
    modbus_controller_id: inverter
    name: "Sorgente Carica: Rete + PV"
    id: sorgente_carica_rete_pv
    register_type: holding
    address: 2955
    write_lambda: |-
      // 0 = Rete + PV | 1 = Solo PV
      return x ? 0 : 1;

  - platform: modbus_controller
    modbus_controller_id: inverter
    name: "Forza Carica Batteria"
    id: forza_carica
    register_type: holding
    address: 2956
    write_lambda: |-
      // 1 = Carica forzata | 0 = Disattiva
      return x ? 1 : 0;
    on_turn_on:
      - script.execute: timeout_carica_forzata
    on_turn_off:
      - script.stop: timeout_carica_forzata

# =========================================================
# SCRIPT (failsafe carica forzata)
# =========================================================
script:
  - id: timeout_carica_forzata
    mode: restart
    then:
      - delay: ${forza_carica_max_minuti}min
      - logger.log:
          level: WARN
          format: "Tempo massimo raggiunto: spengo la carica forzata"
      - switch.turn_off: forza_carica

# =========================================================
# SELECT (modalità di funzionamento)
# =========================================================
# Registro 2300, scritto con function 6 come fa l'app Zonergy
# (frame catturati: 0 = Autoconsumo, 1 = TOU).
# Solo scrittura: l'inverter non permette di rileggerlo. Lo stato mostrato
# è l'ultimo inviato da qui; se cambi modalità dall'app non si aggiorna.
select:
  - platform: template
    name: "Modalità Inverter"
    id: modalita_inverter
    icon: mdi:cog-transfer
    options:
      - "Autoconsumo"
      - "TOU"
    optimistic: true
    restore_value: true
    set_action:
      - lambda: |-
          uint16_t v = (strcmp(x.c_str(), "TOU") == 0) ? 1 : 0;
          auto cmd = modbus_controller::ModbusCommandItem::create_write_single_command(
              id(inverter), 2300, v);
          id(inverter)->queue_command(cmd);
          ESP_LOGW("modalita", "Registro 2300 = %u (%s)", v, x.c_str());

# =========================================================
# NUMBER (scrittura)
# =========================================================
number:
  - platform: modbus_controller
    modbus_controller_id: inverter
    name: "Potenza Carica Forzata"
    id: potenza_carica_forzata
    unit_of_measurement: "W"
    address: 2957
    register_type: holding
    value_type: U_WORD
    min_value: 100
    max_value: 5000
    step: 100
    mode: box

  - platform: modbus_controller
    modbus_controller_id: inverter
    name: "Limite Carica da Rete"
    id: limite_carica_rete
    unit_of_measurement: "W"
    address: 2962
    register_type: holding
    value_type: U_WORD
    min_value: 0
    max_value: 5000
    step: 100
    mode: box

# =========================================================
# TEXT SENSOR (stati leggibili)
# =========================================================
text_sensor:
  - platform: template
    name: "Stato Sistema"
    lambda: |-
      int s = id(stato_lavoro).state;
      if (s == 0) return {"Pragmatic"};
      if (s == 1) return {"Avvio"};
      if (s == 2) return {"In Rete"};
      if (s == 3) return {"Fuori Rete"};
      if (s == 4) return {"Guasto"};
      if (s == 5) return {"PV Fuori Rete"};
      if (s == 6) return {"Calibrazione Tensione"};
      if (s == 7) return {"Autotest"};
      return {"Sconosciuto"};
    update_interval: 10s

  - platform: template
    name: "Inizio Carica 1"
    icon: mdi:clock-outline
    entity_category: diagnostic
    update_interval: 10s
    lambda: |-
      float h = id(r2728).state, m = id(r2729).state;
      if (isnan(h) || isnan(m)) return {"Sconosciuto"};
      int hv = (int) h, mv = (int) m;
      char buf[6] = { (char) (hv >> 8), (char) (hv & 0xFF), ':',
                      (char) (mv >> 8), (char) (mv & 0xFF), 0 };
      for (int i = 0; i < 5; i++) {
        if (i != 2 && (buf[i] < '0' || buf[i] > '9')) return {"Non valido"};
      }
      return {std::string(buf)};

  - platform: template
