  - platform: modbus_controller
    modbus_controller_id: inverter
    name: "Potenza Carico"
    id: potenza_carico
    register_type: read
    address: 2447
    value_type: S_DWORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    filters:
