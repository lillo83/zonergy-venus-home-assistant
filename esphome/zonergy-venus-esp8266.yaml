    id: soc_min
    register_type: read
    address: 3008
    value_type: U_WORD
    unit_of_measurement: "%"
    accuracy_decimals: 0

  - platform: template
    name: "Delta SOC Batterie"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    lambda: |-
      return id(soc_max).state - id(soc_min).state;

