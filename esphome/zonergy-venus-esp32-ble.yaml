substitutions:
  ble_pin: !secret zonergy_ble_pin

esphome:
  name: zonergy-venus-ble
  friendly_name: Zonergy Venus Bluetooth
  project:
    name: lillo83.zonergy_venus_ble
    version: "0.2.0"
  on_boot:
    priority: -100
    then:
      - delay: 60s
      - ble_client.connect: zonergy_dongle

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: INFO

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

json:

esp32_ble_tracker:

ble_client:
  - mac_address: !secret zonergy_ble_mac
    id: zonergy_dongle
    auto_connect: false
    on_connect:
      then:
        - logger.log: "Zonergy Bluetooth connected"
    on_disconnect:
      then:
        - logger.log: "Zonergy Bluetooth disconnected"

