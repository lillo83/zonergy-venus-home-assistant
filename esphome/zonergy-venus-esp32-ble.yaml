text_sensor:
  - platform: ble_client
    ble_client_id: zonergy_dongle
    id: zonergy_ble_data
    name: "Dati BLE Zonergy"
    internal: true
    service_uuid: "EE6D7170-88C6-11E8-B444-060400EF5315"
    characteristic_uuid: "EE6D7171-88C6-11E8-B444-060400EF5315"
    notify: true
    update_interval: never
    on_value:
      then:
        - lambda: |-
            json::parse_json(x, [](JsonObject root) -> bool {
              JsonObject data = root["data"].as<JsonObject>();

              if (data.isNull() || data["code"].as<int>() != 0) {
                return false;
              }

              JsonArray regs = data["regs"].as<JsonArray>();

              for (JsonVariant elemento : regs) {
                JsonArray coppia = elemento.as<JsonArray>();

                if (coppia.size() < 2) {
                  continue;
                }

                int indirizzo = coppia[0].as<int>();
                const char *testo_base64 = coppia[1].as<const char *>();

                if (testo_base64 == nullptr) {
                  continue;
                }

                uint8_t buffer[64];
                size_t lunghezza = esphome::base64_decode(
                  std::string(testo_base64),
                  buffer,
                  sizeof(buffer)
                );

                auto parola = [&](size_t posizione) -> uint16_t {
                  size_t indice = posizione * 2;
                  if (indice + 1 >= lunghezza) {
                    return 0;
                  }

                  return
                    (static_cast<uint16_t>(buffer[indice]) << 8) |
                    static_cast<uint16_t>(buffer[indice + 1]);
                };

                auto parola_con_segno = [&](size_t posizione) -> int16_t {
                  return static_cast<int16_t>(parola(posizione));
                };

                auto doppia_parola = [&](size_t posizione) -> uint32_t {
                  return
                    (static_cast<uint32_t>(parola(posizione)) << 16) |
                    static_cast<uint32_t>(parola(posizione + 1));
                };

                 auto doppia_parola_con_segno = [&](size_t posizione) -> int32_t {
                  return static_cast<int32_t>(doppia_parola(posizione));
                };

                 if (indirizzo == 2100 && lunghezza >= 4) {
                  id(zonergy_ble_pv1_voltage).publish_state(
                    parola(0) * 0.1f
                  );

                  id(zonergy_ble_pv2_voltage).publish_state(
                    parola(1) * 0.1f
                  );
                }

                if (indirizzo == 2112 && lunghezza >= 4) {
                  id(zonergy_ble_pv1_current).publish_state(
                    parola(0) * 0.01f
                  );

                  id(zonergy_ble_pv2_current).publish_state(
                    parola(1) * 0.01f
                  );
                }

                if (indirizzo == 2124 && lunghezza >= 8) {
                  id(zonergy_ble_pv1_power).publish_state(
                    static_cast<float>(doppia_parola(0))
                  );

                  id(zonergy_ble_pv2_power).publish_state(
                    static_cast<float>(doppia_parola(2))
                  );
                }

                                if (indirizzo == 2328 && lunghezza >= 6) {
                  id(zonergy_ble_inverter_temperature).publish_state(
                    parola_con_segno(0) * 0.1f
                  );

                  id(zonergy_ble_dcdc_temperature).publish_state(
                    parola_con_segno(1) * 0.1f
                  );

                  id(zonergy_ble_internal_temperature).publish_state(
                    parola_con_segno(2) * 0.1f
                  );
                }

                  if (indirizzo == 2400 && lunghezza >= 10) {
                  id(zonergy_ble_grid_voltage).publish_state(
                    parola_con_segno(0) * 0.1f
                  );

                  id(zonergy_ble_grid_current).publish_state(
                    parola_con_segno(1) * 0.01f
                  );

                  id(zonergy_ble_grid_frequency).publish_state(
                    parola_con_segno(2) * 0.01f
                  );

                  id(zonergy_ble_grid_power).publish_state(
                    static_cast<float>(doppia_parola_con_segno(3))
                  );
                }

                if (indirizzo == 2445 && lunghezza >= 8) {
                  id(zonergy_ble_load_voltage).publish_state(
                    parola_con_segno(0) * 0.1f
                  );

                  id(zonergy_ble_load_current).publish_state(
                    parola_con_segno(1) * 0.01f
                  );

                  id(zonergy_ble_load_power).publish_state(
                    static_cast<float>(doppia_parola_con_segno(2))
                  );
                }

                                if (indirizzo == 2515 && lunghezza >= 14) {
                  id(zonergy_ble_grid_import_today).publish_state(
                    parola(0) * 0.1f
                  );

                  id(zonergy_ble_grid_import_month).publish_state(
                    doppia_parola(1) * 0.1f
                  );

                  id(zonergy_ble_grid_import_year).publish_state(
                    doppia_parola(3) * 0.1f
                  );

                  id(zonergy_ble_grid_import_total).publish_state(
                    doppia_parola(5) * 0.1f
                  );
                }

                                if (indirizzo == 2522 && lunghezza >= 14) {
                  id(zonergy_ble_grid_export_today).publish_state(
                    parola(0) * 0.1f
                  );

                  id(zonergy_ble_grid_export_month).publish_state(
                    doppia_parola(1) * 0.1f
                  );

                  id(zonergy_ble_grid_export_year).publish_state(
                    doppia_parola(3) * 0.1f
                  );

                  id(zonergy_ble_grid_export_total).publish_state(
                    doppia_parola(5) * 0.1f
                  );
                }

                                if (indirizzo == 2529 && lunghezza >= 14) {
                  id(zonergy_ble_load_energy_today).publish_state(
                    parola(0) * 0.1f
                  );
                  id(zonergy_ble_load_energy_month).publish_state(
                    doppia_parola(1) * 0.1f
                  );
                  id(zonergy_ble_load_energy_year).publish_state(
                    doppia_parola(3) * 0.1f
                  );
                  id(zonergy_ble_load_energy_total).publish_state(
                    doppia_parola(5) * 0.1f
                  );
                }

                                if (indirizzo == 2541 && lunghezza >= 14) {
                  id(zonergy_ble_battery_charge_today).publish_state(
                    parola(0) * 0.1f
                  );
                  id(zonergy_ble_battery_charge_month).publish_state(
                    doppia_parola(1) * 0.1f
                  );
                  id(zonergy_ble_battery_charge_year).publish_state(
                    doppia_parola(3) * 0.1f
                  );
                  id(zonergy_ble_battery_charge_total).publish_state(
                    doppia_parola(5) * 0.1f
                  );
                }

                                if (indirizzo == 2548 && lunghezza >= 14) {
                  id(zonergy_ble_battery_discharge_today).publish_state(
                    parola(0) * 0.1f
                  );
                  id(zonergy_ble_battery_discharge_month).publish_state(
                    doppia_parola(1) * 0.1f
                  );
                  id(zonergy_ble_battery_discharge_year).publish_state(
                    doppia_parola(3) * 0.1f
                  );
                  id(zonergy_ble_battery_discharge_total).publish_state(
                    doppia_parola(5) * 0.1f
                  );
                }

                 if (indirizzo == 2967 && lunghezza >= 6) {
                  id(zonergy_ble_battery_voltage).publish_state(
                    parola_con_segno(0) * 0.1f
                  );

                  id(zonergy_ble_battery_current).publish_state(
                    parola_con_segno(1) * 0.01f
                  );

                  id(zonergy_ble_battery_power).publish_state(
                    static_cast<float>(parola_con_segno(2))
                  );
                }

                if (indirizzo == 3004 && lunghezza >= 6) {
                  id(zonergy_ble_battery_soc).publish_state(
                    static_cast<float>(parola(2))
                  );
                }

                                if (indirizzo == 2148 && lunghezza >= 28) {
                  id(zonergy_ble_pv1_energy_today).publish_state(
                    parola(0) * 0.1f
                  );
                  id(zonergy_ble_pv1_energy_month).publish_state(
                    doppia_parola(1) * 0.1f
                  );
                  id(zonergy_ble_pv1_energy_year).publish_state(
                    doppia_parola(3) * 0.1f
                  );
                  id(zonergy_ble_pv1_energy_total).publish_state(
                    doppia_parola(5) * 0.1f
                  );

                  id(zonergy_ble_pv2_energy_today).publish_state(
                    parola(7) * 0.1f
                  );
                  id(zonergy_ble_pv2_energy_month).publish_state(
                    doppia_parola(8) * 0.1f
                  );
                  id(zonergy_ble_pv2_energy_year).publish_state(
                    doppia_parola(10) * 0.1f
                  );
                  id(zonergy_ble_pv2_energy_total).publish_state(
                    doppia_parola(12) * 0.1f
                  );
                }

                if (indirizzo == 2232 && lunghezza >= 14) {
                  id(zonergy_ble_energy_today).publish_state(
                    parola(0) * 0.1f
                  );

                  id(zonergy_ble_energy_month).publish_state(
                    doppia_parola(1) * 0.1f
                  );

                  id(zonergy_ble_energy_year).publish_state(
                    doppia_parola(3) * 0.1f
                  );

                  id(zonergy_ble_energy_total).publish_state(
                    doppia_parola(5) * 0.1f
                  );
                }

                if (indirizzo == 2241 && lunghezza >= 4) {
                  id(zonergy_ble_pv_total_power).publish_state(
                    static_cast<float>(doppia_parola(0))
                  );
                }
              }

              return true;
            });
