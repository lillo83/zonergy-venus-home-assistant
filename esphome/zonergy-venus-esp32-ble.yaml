          characteristic_uuid: "EE6D7171-88C6-11E8-B444-060400EF5315"
          value: !lambda |-
            std::string richiesta =
              R"json({"type":"getRegs","pin":"${ble_pin}","data":{"regs":[[2000,1],[2100,2],[2112,2],[2124,4],[2148,14],[2232,7],[2241,2],[2967,3],[3004,3],[2400,5],[2445,4],[2328,3]]}})json";
